<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Avatar ilustrado de Oswaldo Danilo Angulo Tamayo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="round"><rect width="320" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="320" height="320" fill="url(#bg)"/>
    <circle cx="60" cy="56" r="90" fill="#ffffff" opacity="0.07"/>
    <circle cx="280" cy="270" r="110" fill="#ffffff" opacity="0.07"/>
    <!-- Hombros -->
    <path d="M60 320c0-52 45-84 100-84s100 32 100 84z" fill="#0f172a" opacity="0.85"/>
    <!-- Cuello -->
    <rect x="142" y="188" width="36" height="44" rx="16" fill="#c98a63"/>
    <!-- Rostro -->
    <ellipse cx="160" cy="150" rx="56" ry="64" fill="#e0a87e"/>
    <!-- Cabello -->
    <path d="M104 142c0-40 25-64 56-64s56 24 56 64c-10-22-30-30-56-30s-46 8-56 30z" fill="#1f2937"/>
    <!-- Ojos -->
    <circle cx="140" cy="150" r="5.5" fill="#111827"/>
    <circle cx="180" cy="150" r="5.5" fill="#111827"/>
    <!-- Sonrisa -->
    <path d="M142 176c8 9 28 9 36 0" stroke="#8b5a3c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Etiqueta de código -->
    <text x="160" y="298" text-anchor="middle" font-family="Consolas, monospace"
          font-size="20" font-weight="700" fill="#93c5fd">&lt;/&gt; dev</text>
  </g>
</svg>
